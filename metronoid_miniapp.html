<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metronoid</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #splash, #startScreen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        #splash { background: #000; }
        #startScreen { 
            background: linear-gradient(180deg, #0d1520 0%, #1a2332 100%);
            display: none;
        }
        .delta-logo {
            font-size: 90px;
            color: #00ff88;
            text-shadow: 
                0 0 10px #00ff88,
                0 0 20px #00ff88,
                0 0 40px #00ff88;
            line-height: 1;
            animation: glow 2.2s ease-in-out infinite alternate;
        }
        .delta-text {
            margin-top: 18px;
            font-size: 18px;
            letter-spacing: 6px;
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
            font-weight: 300;
            animation: glow 2.2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { opacity: 0.85; filter: brightness(1); }
            to   { opacity: 1; filter: brightness(1.15); }
        }
        #splash .hint {
            margin-top: 60px;
            font-size: 12px;
            color: #444;
            letter-spacing: 3px;
        }
        #startScreen h1 {
            font-size: 40px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        #startScreen .sub {
            color: #888;
            font-size: 15px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        #startScreen .desc {
            color: #aaa;
            font-size: 15px;
            text-align: center;
            max-width: 260px;
            line-height: 1.5;
            margin-bottom: 40px;
        }
        #startBtn {
            padding: 14px 50px;
            font-size: 18px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #1a2332;
            max-width: 100%;
            max-height: 100%;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 25px 35px;
            border-radius: 12px;
            z-index: 20;
        }
        #gameOver h2 { color: #ff4444; margin-bottom: 10px; }
        #restartBtn {
            margin-top: 12px;
            padding: 10px 25px;
            background: #2481cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
        }
        .controls div {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div id="splash">
        <div class="delta-logo">Δ</div>
        <div class="delta-text">DELTA</div>
        <div class="hint">TAP TO CONTINUE</div>
    </div>

    <div id="startScreen">
        <h1>Metronoid</h1>
        <div class="sub">Metro Runner</div>
        <div class="desc">Пройди переход метро,<br>не врезавшись в людей</div>
        <button id="startBtn">НАЧАТЬ</button>
    </div>

    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Нажми чтобы начать заново</p>
        <button id="restartBtn">Restart</button>
    </div>
    <div class="controls">
        <div id="btnLeft">◀</div>
        <div id="btnRight">▶</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const splash = document.getElementById('splash');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        const COLS = 7, ROWS = 14;
        let cellSize = 50, playerCol = 3;
        const playerRow = ROWS - 1;
        let enemies = [], tiles = [], score = 0;
        let isRunning = false, frame = 0;
        const spawnEvery = 40, speed = 0.08, floorSpeed = 1.4;
        let nextRowIndex = -10;

        function initTiles() {
            tiles = [];
            nextRowIndex = -20;
            const tileScale = 4;
            for (let i = 0; i < (ROWS + 8) * tileScale; i++) {
                const rowIndex = nextRowIndex + i;
                for (let c = 0; c < COLS * tileScale; c++) {
                    tiles.push({
                        col: c / tileScale,
                        row: rowIndex / tileScale,
                        dark: ((c + rowIndex) % 2) === 0
                    });
                }
            }
        }

        function resize() {
            const maxW = Math.min(window.innerWidth - 20, 420);
            const maxH = Math.min(window.innerHeight - 40, 700);
            cellSize = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
            canvas.width = COLS * cellSize;
            canvas.height = ROWS * cellSize;
            initTiles();
        }
        resize();
        window.addEventListener('resize', resize);

        function spawnEnemy() {
            enemies.push({
                col: Math.floor(Math.random() * COLS),
                row: 0,
                speed: Math.random() < 0.25 ? speed * 1.6 : speed
            });
        }

        function update() {
            if (!isRunning) return;
            frame++;
            for (let t of tiles) t.row += floorSpeed / cellSize;
            tiles = tiles.filter(t => t.row < ROWS + 6);

            let minRow = Infinity;
            for (let t of tiles) if (t.row < minRow) minRow = t.row;

            const tileScale = 4;
            while (minRow > -4) {
                nextRowIndex--;
                const newRow = minRow - (1 / tileScale);
                for (let c = 0; c < COLS * tileScale; c++) {
                    tiles.push({
                        col: c / tileScale,
                        row: newRow,
                        dark: ((c + nextRowIndex) % 2) === 0
                    });
                }
                minRow = newRow;
            }

            if (frame % spawnEvery === 0) spawnEnemy();
            for (let e of enemies) e.row += e.speed;
            enemies = enemies.filter(e => {
                if (e.row > ROWS) { score++; scoreEl.textContent = score; return false; }
                return true;
            });

            for (let e of enemies) {
                if (Math.abs(e.col - playerCol) < 0.1 && Math.abs(e.row - playerRow) < 0.9) {
                    isRunning = false;
                    gameOverEl.style.display = 'block';
                    if (tg) tg.HapticFeedback.notificationOccurred('error');
                    return;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const tileScale = 4;
            const smallTile = cellSize / tileScale;
            for (let t of tiles) {
                ctx.fillStyle = t.dark ? '#f5e6d3' : '#ffffff';
                ctx.fillRect(t.col * cellSize, t.row * cellSize, smallTile - 0.5, smallTile - 0.5);
            }
            const px = playerCol * cellSize + cellSize / 2;
            const py = playerRow * cellSize + cellSize / 2;
            const playerScale = 1 + Math.sin(Date.now() / 150) * 0.06;
            ctx.font = `${cellSize * 0.7 * playerScale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚶', px, py);

            const people = ['🧑','👨','👩','🧑‍🦱','👨‍🦰','👩‍🦰','🧑‍🦳','👴','👵'];
            for (let e of enemies) {
                const stepScale = 1 + Math.sin((Date.now() / 180) + e.col * 2) * 0.08;
                ctx.font = `${cellSize * 0.65 * stepScale}px Arial`;
                ctx.fillText(people[e.col % people.length], e.col * cellSize + cellSize / 2, e.row * cellSize + cellSize / 2);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function moveLeft() { if (isRunning && playerCol > 0) { playerCol--; if (tg) tg.HapticFeedback.impactOccurred('light'); } }
        function moveRight() { if (isRunning && playerCol < COLS - 1) { playerCol++; if (tg) tg.HapticFeedback.impactOccurred('light'); } }

        document.getElementById('btnLeft').addEventListener('click', moveLeft);
        document.getElementById('btnRight').addEventListener('click', moveRight);

        let touchStartX = 0;
        canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
        canvas.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 40) dx > 0 ? moveRight() : moveLeft();
        });

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            if (e.key === 'r' || e.key === 'R') restart();
        });

        function restart() {
            enemies = []; score = 0; scoreEl.textContent = '0';
            playerCol = Math.floor(COLS / 2); isRunning = true; frame = 0;
            initTiles(); gameOverEl.style.display = 'none';
        }

        splash.addEventListener('click', () => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                startScreen.style.display = 'flex';
            }, 400);
        });

        startBtn.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                isRunning = true;
                if (tg) tg.HapticFeedback.impactOccurred('medium');
            }, 400);
        });

        restartBtn.addEventListener('click', restart);
        gameOverEl.addEventListener('click', restart);

        requestAnimationFrame(loop);
    </script>
</body>
</html>
